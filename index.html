<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lepexasu | Bio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg-color: #050505;
            --accent-purple: #bc13fe; /* Твой фиолетовый */
            --gray: #444;
            --pixel-font: 'Press Start 2P', cursive;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); filter: blur(5px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @keyframes blinker { 50% { opacity: 0; } }
        .blink { animation: blinker 1s linear infinite; }

        * {
            font-family: var(--pixel-font) !important;
            image-rendering: pixelated;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(0deg, rgba(188, 19, 254, 0.03) 2px, transparent 2px),
                linear-gradient(90deg, rgba(188, 19, 254, 0.03) 2px, transparent 2px);
            background-size: 40px 40px;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        body::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 550px; /* Значение из первого кода */
        }

        .photo-row {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        .side-photo {
            flex: 1;
            width: 50%;
            height: 200px; /* Значение из первого кода */
            object-fit: cover;
            border: 4px double var(--accent-purple);
            padding: 5px;
            background: rgba(188, 19, 254, 0.05);
            animation: fadeIn 1s ease-out;
            transition: 0.3s;
        }

        .side-photo:hover {
            transform: scale(1.02);
            filter: brightness(1.2);
        }

        .card {
            background: rgba(0, 0, 0, 0.95);
            border: 4px double var(--accent-purple);
            padding: 30px; /* Значение из первого кода */
            text-align: center;
            box-shadow: 10px 10px 0px rgba(188, 19, 254, 0.1);
            animation: fadeIn 0.8s ease-out;
            width: 100%;
        }

        h1 {
            font-size: 1.1rem; /* Значение из первого кода */
            color: var(--accent-purple);
            text-shadow: 0 0 10px rgba(188, 19, 254, 0.5);
            margin: 0 0 30px 0;
        }

        .bio-text {
            font-size: 0.65rem;
            line-height: 1.8;
            color: #eee;
            margin-bottom: 20px;
        }

        .nav-label {
            font-size: 0.5rem;
            color: var(--gray);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        .social-block { display: flex; flex-direction: column; gap: 10px; }

        .link-btn {
            display: block;
            padding: 12px;
            border: 2px solid var(--accent-purple);
            color: var(--accent-purple);
            text-decoration: none;
            font-size: 0.55rem;
            text-align: center;
            transition: 0.3s;
        }

        .link-btn:hover {
            background: var(--accent-purple);
            color: #000;
            box-shadow: 0 0 15px var(--accent-purple);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="photo-row">
            <img src="https://i.ibb.co/TBrxYC06/G0xw-MBQXMAAHpks.webp" class="side-photo" alt="Photo 1">
            <img src="https://i.ibb.co/9mzw8918/Gla-I-6e-XUAAqvnb.webp" class="side-photo" alt="Photo 2">
        </div>

        <div class="card">
            <h1>Hello!!!<span class="blink">_</span></h1>
            
            <div class="bio-text">
                The Info-Site Lepexasu
            </div>

            <div class="nav-label">--- Navigation ---</div>

            <div class="social-block">
                <a href="https://lepexasu.github.io/infolepexasu1/index2.html" class="link-btn">INFORMATION</a>
                <a href="https://lepexasu.github.io/Hobbylepexasu/index3.html" class="link-btn">HOBBY</a>
                <a href="https://lepexasu.github.io/Gamelepexasu/index4.html" class="link-btn">GAMES</a>
                <a href="https://lepexasu.github.io/Lepexasufandoms/index5.html" class="link-btn">FANDOMS</a>
            </div>
        </div>
    </div>

</body>
</html>
