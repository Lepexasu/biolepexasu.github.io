<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lepexasu | Main Terminal</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --accent-purple: #bc13fe;
            --pixel-font: 'Press Start 2P', cursive;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); filter: blur(5px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(0deg, rgba(188, 19, 254, 0.05) 2px, transparent 2px),
                linear-gradient(90deg, rgba(188, 19, 254, 0.05) 2px, transparent 2px);
            background-size: 40px 40px;
            color: #fff;
            font-family: var(--pixel-font);
            -webkit-font-smoothing: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        body::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .header-images {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 1000px;
            animation: fadeIn 1s ease-out forwards;
        }

        .header-images img {
            flex: 1;
            height: 250px;
            width: 33%;
            object-fit: cover;
            border: 4px solid var(--accent-purple);
            image-rendering: pixelated;
            box-shadow: 0 0 15px rgba(188, 19, 254, 0.2);
            background: #111;
        }

        .card {
            background: rgba(0, 0, 0, 0.95);
            border: 6px double var(--accent-purple);
            padding: 60px 40px;
            text-align: center;
            width: 95%;
            max-width: 900px;
            box-shadow: 15px 15px 0px rgba(188, 19, 254, 0.15);
            animation: fadeIn 1.2s ease-out 0.3s forwards;
            opacity: 0;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 20px 0;
            color: var(--accent-purple);
            text-shadow: 4px 4px #3a005c;
        }

        .bio-text {
            font-size: 1.2rem;
            color: #fff;
            line-height: 2;
            margin-bottom: 40px;
        }

        .nav-label {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        .btn-group {
            display: flex;
            gap: 20px;
            flex-direction: column;
        }

        @media (min-width: 768px) { .btn-group { flex-direction: row; } }

        .btn {
            flex: 1;
            padding: 25px 10px;
            border: 3px solid var(--accent-purple);
            color: var(--accent-purple);
            text-decoration: none;
            font-size: 0.8rem;
            transition: 0.2s;
            background: transparent;
        }

        .btn:hover {
            background: var(--accent-purple);
            color: #000;
            box-shadow: 0 0 30px var(--accent-purple);
            transform: scale(1.05);
        }

        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="header-images">
        <img src="https://i.ibb.co/TBrxYC06/G0xw-MBQXMAAHpks.webp" alt="G0xw-MBQXMAAHpks">
        <img src="https://i.ibb.co/zdDMcdM/G0-N29tg-WQAA8-Oc1.webp" alt="G0-N29tg-WQAA8-Oc1">
        <img src="https://i.ibb.co/9mzw8918/Gla-I-6e-XUAAqvnb.webp" alt="Gla-I-6e-XUAAqvnb">
    </div>

    <div class="card">
        <h1>Hello!!!<span class="blink">_</span></h1>
        
        <div class="bio-text">
            The Bio-Site Lepexasu
        </div>

        <div class="nav-label">--- Navigation ---</div>

        <div class="btn-group">
            <a href="index2.html" class="btn">INFORMATION</a>
            <a href="#" class="btn">HOBBY</a>
            <a href="#" class="btn">GAMES</a>
        </div>
    </div>

</body>
</html>
